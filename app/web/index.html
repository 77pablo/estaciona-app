<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Estaciona — encuentra estacionamiento en todo Chile: dónde hay, cuánto cobran y si es gratis." />
  <title>Estaciona — estacionamiento en todo Chile</title>
  <!-- Open Graph / Twitter: tarjeta linda al compartir el link (WhatsApp, redes).
       OJO: og:image debe ser URL absoluta; si cambia el dominio, actualizar aquí. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Estaciona" />
  <meta property="og:title" content="Estaciona — dónde estacionar en todo Chile" />
  <meta property="og:description" content="Precio, si es gratis, horario y disponibilidad — y la gente reporta si hay cupo. Sin cuenta." />
  <meta property="og:image" content="https://estaciona-app-production.up.railway.app/icons/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://estaciona-app-production.up.railway.app/app" />
  <meta property="og:locale" content="es_CL" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Estaciona — dónde estacionar en todo Chile" />
  <meta name="twitter:description" content="Precio, si es gratis y disponibilidad. Sin cuenta." />
  <meta name="twitter:image" content="https://estaciona-app-production.up.railway.app/icons/og-image.png" />
  <!-- Favicon: emoji 🅿️ como SVG en data-URI (sin archivos extra). -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🅿️</text></svg>" />
  <!-- PWA: instalable en el celular + funciona sin señal (ver sw.js). -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Estaciona" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Color de barra del navegador (app siempre oscura, tema movilidad urbana). -->
  <meta name="theme-color" content="#0d0f14" />
  <!-- Pistas de carga: abrir conexión a los orígenes externos antes de pedirles
       nada. Leaflet ahora es LOCAL (/vendor); maptiler sirve los tiles del mapa
       (decenas de peticiones al cargar) → preconnect. El resto son orígenes
       diferidos/opcionales (tráfico, modelo de fotos, tiles OSM de respaldo) →
       dns-prefetch, más barato. NO cambia el orden de los scripts. -->
  <link rel="preconnect" href="https://api.maptiler.com" crossorigin />
  <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
  <link rel="dns-prefetch" href="https://api.tomtom.com" />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="/vendor/leaflet.css" />
  <!-- Agrupado de pines (clustering) cuando hay muchos. Solo el CSS núcleo
       (animaciones/posición); el estilo del clúster lo da styles.css para el
       tema oscuro. Si el script falla, la app cae a pines sueltos (ver app.js). -->
  <link rel="stylesheet" href="/vendor/MarkerCluster.css" />
  <!-- Tipografía: Urbanist (UI + títulos) + Geist Mono (precios y datos numéricos). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="phone">
    <!-- Encabezado -->
    <header class="appbar">
      <h1 class="brand"><svg class="ic-svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M9.5 16.5v-9h3.4a2.7 2.7 0 0 1 0 5.4H9.5"/></svg> <b>Estaciona</b></h1>
      <div class="searchbar">
        <svg class="ic-svg" style="color:var(--muted)" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.1-4.1"/></svg>
        <input id="search" type="text" placeholder="Buscar nombre, calle o dirección…" autocomplete="off" enterkeyhint="search" aria-label="Buscar estacionamiento por nombre, calle o dirección" aria-describedby="search-hint" />
        <span id="search-hint" class="sr-only">Presiona Enter para buscar una dirección o lugar en el mapa.</span>
        <span id="search-spin" class="search-spin" hidden aria-hidden="true"></span>
        <button id="search-clear" class="search-clear" type="button" hidden title="Limpiar búsqueda" aria-label="Limpiar búsqueda"><svg class="ic-svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        <button id="btn-filtros" class="has-badge" title="Filtros" aria-label="Filtros"><svg class="ic-svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="10" cy="7" r="2.3" fill="currentColor"/><circle cx="15" cy="12" r="2.3" fill="currentColor"/><circle cx="8" cy="17" r="2.3" fill="currentColor"/></svg><span class="badge" id="filtros-badge" hidden></span></button>
        <div id="search-suggest" class="search-suggest" role="listbox" aria-label="Resultados de todo Chile" hidden></div>
      </div>
      <div class="appbar-right">
        <span class="fecha-pill" title="Fecha de hoy"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg> <b id="fecha-hoy">Hoy</b></span>
        <label class="loc-select-wrap"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s6.5-5.4 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15.6 12 21 12 21Z"/><circle cx="12" cy="10.5" r="2.3"/></svg>
          <select class="loc-select" id="ciudad-select" aria-label="Elegir ciudad"></select>
        </label>
      </div>
    </header>

    <!-- VISTA: BUSCAR -->
    <section class="view active" id="view-buscar">
      <div class="chips" id="chips">
        <button class="chip" aria-pressed="false" data-f="gratis"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3.5h7L21 14.5l-6.5 6.5L3.5 10.5V3.5Z"/><circle cx="7.3" cy="7.3" r="1.3"/></svg> Gratis</button>
        <button class="chip" aria-pressed="false" data-f="barato"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><circle cx="16.5" cy="14.5" r="1.1" fill="currentColor"/></svg> Barato</button>
        <button class="chip" aria-pressed="false" data-f="techado"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/></svg> Techado</button>
        <button class="chip" aria-pressed="false" data-f="abierto"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg> Abierto</button>
        <button class="chip" aria-pressed="false" data-f="cupo"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.3 12 2.4 2.4 5-5.4"/></svg> Con cupo</button>
        <!-- Acción (no es un filtro): reportar un estacionamiento que falta. -->
        <button class="chip-add" id="btn-reportar" type="button" aria-label="Agregar un estacionamiento que falta"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Agregar lugar</button>
      </div>
      <div id="map" role="application" aria-label="Mapa de estacionamientos">
        <!-- Mira central para marcar un lugar nuevo (apunta al centro del mapa). -->
        <div id="crosshair" class="crosshair" hidden aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg></div>
      </div>
      <!-- Barra de confirmación del modo "reportar lugar" (sobre el mapa). -->
      <div id="reportar-bar" class="reportar-bar" role="dialog" aria-label="Marcar ubicación del estacionamiento">
        <span class="rep-bar-txt"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg> Centra el mapa sobre el lugar y confirma</span>
        <div class="rep-bar-btns">
          <button class="btn btn-ghost" type="button" onclick="cancelarReporte()">Cancelar</button>
          <button class="btn btn-primary" type="button" onclick="confirmarUbicacionReporte()">Confirmar ubicación</button>
        </div>
      </div>
      <button id="btn-zona" class="zona-btn"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4v4.3h-4.3"/></svg> Buscar cerca de aquí</button>
      <div class="sheet">
        <div class="sheet-head">
          <span id="sheet-count" aria-live="polite" aria-atomic="true">Cargando…</span>
          <label class="orden-lbl">Ordenar:
            <select id="sheet-order" aria-label="Ordenar resultados">
              <option value="recomendado">Recomendado</option>
              <option value="cercania">Cercanía</option>
              <option value="precio">Precio</option>
              <option value="disponible">Disponibilidad</option>
            </select>
          </label>
        </div>
        <div id="lista"></div>
      </div>
      <!-- Botón para plegar/desplegar el panel izquierdo (solo PC). -->
      <button id="btn-panel" class="panel-toggle" title="Ocultar/mostrar panel" aria-label="Ocultar panel"><span aria-hidden="true">⟨</span></button>
    </section>

    <!-- VISTA: MI AUTO -->
    <section class="view" id="view-miauto"></section>

    <!-- VISTA: FAVORITOS -->
    <section class="view" id="view-favoritos"></section>

    <!-- Navegación inferior -->
    <nav class="bottomnav">
      <button class="nav active" data-view="buscar" aria-label="Mapa"><svg class="ic-svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s6.5-5.4 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15.6 12 21 12 21Z"/><circle cx="12" cy="10.5" r="2.3"/></svg>Mapa</button>
      <button class="nav" data-view="miauto" aria-label="Mi auto"><svg class="ic-svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l1.4-4.2A2 2 0 0 1 8.3 7.4h7.4a2 2 0 0 1 1.9 1.4L19 13"/><path d="M4 13h16v3.5a1 1 0 0 1-1 1h-1.5a1 1 0 0 1-1-1V16H7.5v.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V13Z"/><path d="M7.5 15.6h.01M16.5 15.6h.01"/></svg>Mi auto</button>
      <button class="nav" data-view="favoritos" aria-label="Favoritos"><svg class="ic-svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8-4.3-4.2 5.9-.8L12 3.5Z"/></svg>Favoritos</button>
    </nav>

    <!-- Overlays -->
    <div class="overlay" id="detalle" role="dialog" aria-modal="true" aria-label="Detalle del estacionamiento" inert></div>
    <div class="modal-bg" id="modal-bg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
    <div class="onboard" id="onboard"></div>
    <div id="banner" role="status" aria-live="assertive"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <!-- Card flotante sobre el mapa (al tocar un pin). La llena app.js. -->
    <div id="mapcard" class="mapcard" hidden></div>
    <!-- Barra flotante de comparación (aparece al elegir lugares para comparar). -->
    <div id="comparar-bar" class="comparar-bar">
      <span class="cmp-count">0 seleccionados</span>
      <div class="cmp-bar-btns">
        <button class="cmp-bar-clear" type="button" onclick="limpiarComparar()" aria-label="Quitar selección"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        <button class="cmp-bar-go btn btn-primary" type="button" onclick="abrirComparar()"><svg class="ic-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h14l-3.5-3.5M21 16H7l3.5 3.5"/></svg> Comparar</button>
      </div>
    </div>
  </div>

  <script src="/vendor/leaflet.js"></script>
  <!-- Clustering de pines. Si no carga, app.js detecta la ausencia de
       L.markerClusterGroup y usa pines sueltos sin romperse. -->
  <script src="/vendor/leaflet.markercluster.js"></script>
  <script src="/app.js"></script>
  <!-- Píldora de fecha del header: muestra el día de hoy (informativo). -->
  <script>(function(){var e=document.getElementById('fecha-hoy');if(e){var d=new Date().toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'});e.textContent='Hoy · '+d;}})();</script>
</body>
</html>
